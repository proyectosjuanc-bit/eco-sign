<!--
  ECO-SIGN · Plantilla del correo de confirmación de cuenta.

  Se pega en Supabase: Authentication > Email Templates > Confirm signup.
  Asunto sugerido: Confirma tu cuenta de ECO-SIGN

  El enlace usa token_hash (no el {{ .ConfirmationURL }} por defecto) para
  que funcione aunque el correo se abra en otro navegador o en el celular:
  /auth/confirmar lo valida, inicia la sesión y entra directo al panel.
  Ver supabase/ESQUEMA.md, sección "Confirmación de cuenta".

  Mismo estilo que src/lib/email/templates.ts: tablas y estilos en línea,
  que es lo único que Gmail y Outlook respetan.
-->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background-color:#f6f7f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7f6;padding:24px 12px;">
<tr>
<td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
<tr>
<td style="padding:24px 28px 8px 28px;">
<span style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:18px;font-weight:700;color:#16a34a;letter-spacing:-0.01em;">ECO-SIGN</span>
</td>
</tr>
<tr>
<td style="padding:8px 28px 28px 28px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.6;color:#111827;">
<h1 style="margin:0 0 12px 0;font-size:20px;line-height:1.3;font-weight:600;color:#111827;">Confirma tu cuenta</h1>
<p style="margin:0 0 14px 0;">Recibimos tu registro en ECO-SIGN. Toca el botón para confirmar que este correo es tuyo y entrar a tu panel.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 16px 0;">
<tr><td style="background-color:#16a34a;border-radius:6px;">
<a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=signup" style="display:inline-block;padding:11px 20px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;font-weight:600;color:#ffffff;text-decoration:none;">Confirmar mi cuenta</a>
</td></tr>
</table>
<p style="margin:0 0 14px 0;font-size:13px;color:#6b7280;">El enlace sirve una sola vez. Si no creaste una cuenta en ECO-SIGN, ignora este correo.</p>
</td>
</tr>
</table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
<tr>
<td style="padding:16px 28px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.5;color:#6b7280;text-align:center;">
ECO-SIGN — Convierte desperdicio en valor
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
